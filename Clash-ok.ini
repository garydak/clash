; Clash-ok：参考 Clash-Full.ini，使用合并后的分类规则。
;1、域名组
; 按顺序匹配：检测优先，分类规则其次，国外通用规则随后，未匹配流量最终进入国内组。
ruleset=⏱️ 检测,https://raw.githubusercontent.com/garydak/clash/main/list/Check.list
ruleset=✨ AI,https://raw.githubusercontent.com/garydak/clash/main/list/AI.list
ruleset=📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=💬 海外通讯,https://raw.githubusercontent.com/garydak/clash/main/list/Communication.list
ruleset=🎞️ 海外视频,https://raw.githubusercontent.com/garydak/clash/main/list/YouTube.list
ruleset=👌 虚拟币,https://raw.githubusercontent.com/garydak/clash/main/list/xnb.list
ruleset=🌍 国外,https://raw.githubusercontent.com/garydak/clash/main/list/Proxy.list
ruleset=➡️ 国内,[]FINAL

;2、策略组（域名组-节点组）
; 海外分类默认选择所有-手动；国内兜底默认直连，均可在客户端切换。
; 检测组选择要测试的节点或地区组；测本地网络时选择 DIRECT。
custom_proxy_group=⏱️ 检测`select`[]所有-手动`[]DIRECT`[]所有-自动`[]港台日新韩-自动`[]台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]其他-自动`[]REJECT
